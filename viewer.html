<script>
// Report startup/import/WebGL failures too: the outer loader must not hang on them.
window.pix3lwareGarageFailed = false;
function reportGarageFailure() {
  window.pix3lwareGarageFailed = true;
  const status = document.getElementById('status');
  if (status) status.textContent = 'The viewer could not start. Check your connection and WebGL support.';
  if (parent !== window) parent.postMessage({type:'pix3lware:garage-error'}, document.referrer ? new URL(document.referrer).origin : '*');
}
window.addEventListener('error', reportGarageFailure, true);
window.addEventListener('unhandledrejection', reportGarageFailure);
window.addEventListener('message', event => {
  if (event.source === parent && event.data?.type === 'pix3lware:status-request' && window.pix3lwareGarageFailed) reportGarageFailure();
});
</script>
